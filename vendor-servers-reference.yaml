# Du lieu port server tra tu tai lieu chinh hang (spec sheet / QuickSpecs / datasheet chinh thuc).
# Moi model deu co "source" + ngay truy cap - CHUA xac nhan thi KHONG dua vao file nay (tranh bia so lieu).
# Pham vi hien tai: rack server 1U/2U mainstream, generation hien hanh (thang 09/2026).
#
# Ghi chu quan trong khi dung cho port-sizing-tool:
# - "mgmt_hw" (iDRAC/iLO/HDM) luon la 1 port RJ45 rieng, dung nhu gia dinh trong rules.yaml.
# - KHONG co vendor nao co mot port "mgmt_os" vat ly rieng biet. "mgmt_os" trong rules.yaml la
#   khai niem logic (VLAN/NIC rieng cho quan ly OS/hypervisor), thuong trich ra tu LOM hoac data NIC,
#   khong phai 1 port hardware doc lap. Neu thiet ke thuc te tach VLAN nay tren cung NIC data thi
#   KHONG cong them port rieng cho mgmt_os.
# - HPE Gen11 va H3C G6 KHONG co onboard LOM cho data (khac Dell R660/R760 van co LOM 2x1GbE optional).
#   Toan bo port data cua ca 3 hang hien nay chu yeu di qua OCP 3.0 card (chon luc theo BOM,
#   pho bien la 2 port 10/25GbE, nhung co the la 4x1GbE hoac 2x100GbE tuy card duoc chon).
#   => so "data ports" thuc te PHU THUOC vao NIC card duoc order, khong co so cung dinh nhu iDRAC/iLO/HDM.

vendors:
  dell:
    models:
      - model: "PowerEdge R660"
        form_factor: "1U"
        mgmt_hw_ports: 1
        mgmt_hw_note: "1 x Dedicated iDRAC Ethernet port (rear)"
        embedded_lom: "2 x 1 GbE LOM card (optional)"
        ocp_slot: "1 x OCP NIC 3.0 (optional) - co the lap dong thoi voi LOM"
        pcie_slots_max: 3
        source: "https://www.delltechnologies.com/asset/en-us/products/servers/technical-support/poweredge-r660-spec-sheet.pdf"
        source_type: "Dell Specification Sheet (PDF, June 2024)"
        checked: "2026-09-22"
      - model: "PowerEdge R760"
        form_factor: "2U"
        mgmt_hw_ports: 1
        mgmt_hw_note: "1 x Dedicated iDRAC Ethernet port (rear)"
        embedded_lom: "2 x 1 GbE LOM card (optional)"
        ocp_slot: "1 x OCP NIC 3.0 (optional) - co the lap dong thoi voi LOM"
        pcie_slots_max: 8
        source: "https://www.delltechnologies.com/asset/en-us/products/servers/technical-support/poweredge-r760-spec-sheet.pdf"
        source_type: "Dell Specification Sheet (PDF, June 2024)"
        checked: "2026-09-22"

