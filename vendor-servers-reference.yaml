        ocp_slot: "2 x OCP 3.0 (moi slot: 4xGE hoac 2x10GE hoac 2x25GE hoac 2x100GE)"
        pcie_slots_max: 4
        pcie_slots_note: "3 x PCIe 5.0 + 1 x PCIe 4.0 (chua tinh 2 OCP slot)"
        source: "https://www.h3c.com/en/Products_and_Solutions/Computing/UniServer_Series/Products_With_Picture/2U/R4700_G6/R4700_G6/"
        source_type: "H3C official product page"
