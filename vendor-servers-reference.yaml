        embedded_lom: "Khong co - bat buoc chon OCP card hoac stand-up (FlexibleLOM) card khi dat hang"
        ocp_slot: "2 x OCP 3.0 (slot thu 2 yeu cau lap CPU thu 2)"
        pcie_slots_max: "2 x16 PCIe Gen5 + 2 OCP slot"
        source: "https://www.hpe.com/psnow/doc/a50004306enw"
        source_type: "HPE QuickSpecs (a50004306enw)"
        checked: "2026-09-22"
      - model: "ProLiant DL380 Gen11"
